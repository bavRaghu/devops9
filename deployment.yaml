apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-repository-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: docker-repository
  template:
    metadata:
      labels:
        app: docker-repository
    spec:
      containers:
        - name: docker-repository
          image: bavyaraghu/docker-repository:latest
          ports:
            - containerPort: 5000
